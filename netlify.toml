[build]
  publish = "."
  functions = "netlify/functions"

# Ottelukohtaiset jakolinkit (linkin esikatselukortit WhatsAppissa ym.)
[[redirects]]
  from = "/ottelu/*"
  to = "/.netlify/functions/jaa/:splat"
  status = 200

# Tuoreimman ottelun kansikuva etusivun og:image-tagille
[[redirects]]
  from = "/og-kuva/uusin"
  to = "/.netlify/functions/jaa/og-kuva/uusin"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://static.cloudflareinsights.com https://gc.zgo.at; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com; connect-src 'self' https://res.cloudinary.com https://api.cloudinary.com https://accounts.google.com https://cloudflareinsights.com https://*.goatcounter.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'"
